<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Escala aproximada de diferencia de electronegatividad</title><desc id="d">Criterio orientativo para clasificar enlaces covalentes no polares, covalentes polares e iónicos según diferencia de electronegatividad.</desc><rect width="1200" height="540" fill="#fff"/><text x="600" y="62" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="34" font-weight="800" fill="#143a37">Diferencia de electronegatividad</text><text x="600" y="102" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="22" fill="#52706d">ΔEN = |EN₁ − EN₂|</text><g font-family="Nunito,Arial,sans-serif"><rect x="110" y="170" width="250" height="190" rx="26" fill="#eaf8f6" stroke="#0f9f9a" stroke-width="4"/><text x="235" y="220" text-anchor="middle" font-size="24" font-weight="800" fill="#0c706c">0 a 0,4</text><text x="235" y="268" text-anchor="middle" font-size="23" font-weight="800" fill="#143a37">Covalente</text><text x="235" y="301" text-anchor="middle" font-size="23" font-weight="800" fill="#143a37">no polar</text><text x="235" y="335" text-anchor="middle" font-size="17" fill="#52706d">compartición casi equivalente</text><rect x="475" y="170" width="250" height="190" rx="26" fill="#eef2ff" stroke="#7652aa" stroke-width="4"/><text x="600" y="220" text-anchor="middle" font-size="24" font-weight="800" fill="#65409a">0,4 a 1,7</text><text x="600" y="268" text-anchor="middle" font-size="23" font-weight="800" fill="#143a37">Covalente</text><text x="600" y="301" text-anchor="middle" font-size="23" font-weight="800" fill="#143a37">polar</text><text x="600" y="335" text-anchor="middle" font-size="17" fill="#52706d">aparecen δ⁺ y δ⁻</text><rect x="840" y="170" width="250" height="190" rx="26" fill="#fff3e8" stroke="#d65f45" stroke-width="4"/><text x="965" y="220" text-anchor="middle" font-size="24" font-weight="800" fill="#a33e2b">&gt; 1,7</text><text x="965" y="268" text-anchor="middle" font-size="23" font-weight="800" fill="#143a37">Carácter iónico</text><text x="965" y="301" text-anchor="middle" font-size="23" font-weight="800" fill="#143a37">predominante</text><text x="965" y="335" text-anchor="middle" font-size="17" fill="#52706d">especialmente metal + no metal</text><path d="M360 265h95M725 265h95" stroke="#143a37" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#143a37"/></marker></defs><text x="600" y="425" text-anchor="middle" font-size="20" font-weight="800" fill="#143a37">Es un criterio orientativo, no una frontera física exacta.</text><text x="600" y="462" text-anchor="middle" font-size="18" fill="#52706d">También importa qué elementos participan y qué estructura forma la sustancia.</text></g></svg>