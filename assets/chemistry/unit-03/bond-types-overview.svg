<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Tipos de enlace químico</title><desc id="d">Comparación visual de enlaces covalente, iónico y metálico, vinculados con electrones de valencia y estabilidad.</desc><rect width="1200" height="620" fill="#ffffff"/><text x="600" y="58" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="34" font-weight="800" fill="#143a37">Enlace químico</text><text x="600" y="96" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="20" fill="#52706d">electrones de valencia → interacción → menor energía del sistema</text><g font-family="Nunito,Arial,sans-serif"><rect x="55" y="150" width="340" height="380" rx="26" fill="#eaf8f6" stroke="#0f9f9a" stroke-width="4"/><text x="225" y="202" text-anchor="middle" font-size="28" font-weight="800" fill="#0c706c">Covalente</text><circle cx="170" cy="290" r="48" fill="#d8f0ff" stroke="#2563a8" stroke-width="4"/><circle cx="280" cy="290" r="48" fill="#d8f0ff" stroke="#2563a8" stroke-width="4"/><circle cx="215" cy="290" r="10" fill="#143a37"/><circle cx="235" cy="290" r="10" fill="#143a37"/><text x="225" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#143a37">comparten electrones</text><text x="225" y="417" text-anchor="middle" font-size="18" fill="#52706d">no metal + no metal</text><text x="225" y="456" text-anchor="middle" font-size="18" fill="#52706d">moléculas o redes covalentes</text><rect x="430" y="150" width="340" height="380" rx="26" fill="#eef2ff" stroke="#7652aa" stroke-width="4"/><text x="600" y="202" text-anchor="middle" font-size="28" font-weight="800" fill="#65409a">Iónico</text><circle cx="540" cy="290" r="52" fill="#ffe3df" stroke="#d65f45" stroke-width="4"/><text x="540" y="299" text-anchor="middle" font-size="25" font-weight="800" fill="#8b3222">Na⁺</text><circle cx="660" cy="290" r="60" fill="#e0f6ed" stroke="#1b8f61" stroke-width="4"/><text x="660" y="299" text-anchor="middle" font-size="25" font-weight="800" fill="#176947">Cl⁻</text><path d="M595 290h20" stroke="#143a37" stroke-width="5"/><text x="600" y="378" text-anchor="middle" font-size="22" font-weight="700" fill="#143a37">cationes + aniones</text><text x="600" y="417" text-anchor="middle" font-size="18" fill="#52706d">transferencia + atracción</text><text x="600" y="456" text-anchor="middle" font-size="18" fill="#52706d">red cristalina</text><rect x="805" y="150" width="340" height="380" rx="26" fill="#fff7df" stroke="#b27a00" stroke-width="4"/><text x="975" y="202" text-anchor="middle" font-size="28" font-weight="800" fill="#8c6100">Metálico</text><g fill="#d9e5f2" stroke="#2563a8" stroke-width="3"><circle cx="900" cy="270" r="35"/><circle cx="975" cy="270" r="35"/><circle cx="1050" cy="270" r="35"/><circle cx="938" cy="335" r="35"/><circle cx="1012" cy="335" r="35"/></g><g fill="#0f9f9a"><circle cx="884" cy="320" r="8"/><circle cx="970" cy="222" r="8"/><circle cx="1084" cy="316" r="8"/><circle cx="1030" cy="385" r="8"/><circle cx="920" cy="390" r="8"/></g><text x="975" y="414" text-anchor="middle" font-size="22" font-weight="700" fill="#143a37">electrones deslocalizados</text><text x="975" y="453" text-anchor="middle" font-size="18" fill="#52706d">red de centros metálicos</text><text x="975" y="490" text-anchor="middle" font-size="18" fill="#52706d">conductividad + maleabilidad</text></g><rect x="245" y="557" width="710" height="42" rx="21" fill="#143a37"/><text x="600" y="585" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffffff">La configuración electrónica orienta; la estabilidad se decide por la energía total.</text></svg>