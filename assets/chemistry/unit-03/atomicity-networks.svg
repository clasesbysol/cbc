<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Moléculas, atomicidad y redes</title><desc id="d">Comparación de moléculas discretas con atomicidad definida y redes iónicas, covalentes y metálicas.</desc><rect width="1200" height="700" fill="#fff"/><text x="600" y="58" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="34" font-weight="800" fill="#143a37">¿Hay moléculas discretas o una red?</text><g font-family="Nunito,Arial,sans-serif"><rect x="55" y="120" width="520" height="500" rx="28" fill="#eef8ff" stroke="#2563a8" stroke-width="4"/><text x="315" y="172" text-anchor="middle" font-size="28" font-weight="800" fill="#2563a8">Moléculas discretas</text><text x="315" y="210" text-anchor="middle" font-size="20" fill="#52706d">sí tiene sentido hablar de atomicidad</text><g fill="#d8f0ff" stroke="#2563a8" stroke-width="3"><circle cx="205" cy="305" r="38"/><circle cx="275" cy="305" r="38"/><circle cx="355" cy="305" r="38"/><circle cx="425" cy="305" r="38"/></g><text x="315" y="380" text-anchor="middle" font-size="21" font-weight="700" fill="#143a37">H₂ → atomicidad 2</text><text x="315" y="420" text-anchor="middle" font-size="21" font-weight="700" fill="#143a37">H₂O → atomicidad 3</text><text x="315" y="460" text-anchor="middle" font-size="21" font-weight="700" fill="#143a37">P₄ → atomicidad 4</text><text x="315" y="520" text-anchor="middle" font-size="18" fill="#52706d">La fórmula describe una molécula individual.</text><rect x="625" y="120" width="520" height="500" rx="28" fill="#f5f3ff" stroke="#7652aa" stroke-width="4"/><text x="885" y="172" text-anchor="middle" font-size="28" font-weight="800" fill="#65409a">Redes extendidas</text><text x="885" y="210" text-anchor="middle" font-size="20" fill="#52706d">no hay una molécula aislada para contar</text><g><g fill="#ffe3df" stroke="#d65f45" stroke-width="2"><circle cx="760" cy="300" r="30"/><circle cx="860" cy="300" r="30"/><circle cx="960" cy="300" r="30"/><circle cx="810" cy="380" r="30"/><circle cx="910" cy="380" r="30"/></g><g fill="#e0f6ed" stroke="#1b8f61" stroke-width="2"><circle cx="810" cy="300" r="30"/><circle cx="910" cy="300" r="30"/><circle cx="760" cy="380" r="30"/><circle cx="860" cy="380" r="30"/><circle cx="960" cy="380" r="30"/></g></g><text x="885" y="460" text-anchor="middle" font-size="21" font-weight="700" fill="#143a37">NaCl → red iónica</text><text x="885" y="500" text-anchor="middle" font-size="21" font-weight="700" fill="#143a37">SiO₂ → red covalente</text><text x="885" y="540" text-anchor="middle" font-size="21" font-weight="700" fill="#143a37">Cu → red metálica</text><text x="885" y="582" text-anchor="middle" font-size="18" fill="#52706d">La fórmula indica proporción o composición, no atomicidad molecular.</text></g><rect x="125" y="645" width="950" height="40" rx="20" fill="#143a37"/><text x="600" y="672" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff">Atomicidad = cantidad de átomos que forman una molécula discreta.</text></svg>