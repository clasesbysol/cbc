<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Notación nuclear</title><desc id="d">Esquema que relaciona número atómico, número másico, protones, neutrones y electrones.</desc><rect width="900" height="300" rx="28" fill="#eaf8f6"/><text x="390" y="175" font-family="Nunito,sans-serif" font-size="105" font-weight="900" fill="#143a37">X</text><text x="315" y="92" font-family="Nunito,sans-serif" font-size="44" font-weight="800" fill="#0f9f9a">A</text><text x="315" y="220" font-family="Nunito,sans-serif" font-size="44" font-weight="800" fill="#0f9f9a">Z</text><text x="472" y="92" font-family="Nunito,sans-serif" font-size="38" font-weight="800" fill="#0f9f9a">q</text><g stroke="#71bbb5" stroke-width="4" fill="none"><path d="M292 80H150v45"/><path d="M292 210H150v-45"/><path d="M500 80h190v42"/></g><g font-family="Nunito,sans-serif" font-size="22" font-weight="800" fill="#143a37"><text x="55" y="145">A = p + n</text><text x="55" y="190">Z = protones</text><text x="665" y="145">q = p − e</text><text x="595" y="210">electrones = Z − q</text></g></svg>
