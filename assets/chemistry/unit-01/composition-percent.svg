<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Composición centesimal</title><desc id="d">Una barra de cien partes muestra cómo se calcula el porcentaje en masa de cada componente.</desc><rect width="720" height="300" rx="28" fill="#eaf8f6"/><text x="360" y="62" font-family="Nunito,sans-serif" font-weight="900" font-size="28" fill="#143a37" text-anchor="middle">% m/m = masa del componente ÷ masa total × 100</text><rect x="60" y="110" width="600" height="70" rx="18" fill="#fff" stroke="#84bbb6" stroke-width="4"/><path d="M60 110h240v70H60z" fill="#0f9f9a"/><path d="M300 110h180v70H300z" fill="#50c7bd"/><path d="M480 110h180v70H480z" fill="#9de0da"/><g font-family="Nunito,sans-serif" font-weight="800" fill="#143a37" text-anchor="middle"><text x="180" y="225" font-size="19">40 % A</text><text x="390" y="225" font-size="19">30 % B</text><text x="570" y="225" font-size="19">30 % C</text><text x="360" y="266" font-size="18">Control: 40 + 30 + 30 = 100 %</text></g></svg>
