<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Ruta para identificar fuerzas intermoleculares</title><desc id="d">Esquema desde el tipo de partícula y la polaridad hasta las interacciones y propiedades.</desc><rect width="1200" height="640" fill="#fff"/><text x="600" y="58" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="34" font-weight="800" fill="#143a37">De la estructura a la propiedad</text><g font-family="Nunito,Arial,sans-serif"><rect x="70" y="150" width="215" height="120" rx="24" fill="#eef8ff" stroke="#2563a8" stroke-width="4"/><text x="177" y="198" text-anchor="middle" font-size="22" font-weight="800" fill="#2563a8">Partícula</text><text x="177" y="232" text-anchor="middle" font-size="18" fill="#52706d">ion / molécula</text><rect x="355" y="150" width="215" height="120" rx="24" fill="#f5f3ff" stroke="#7652aa" stroke-width="4"/><text x="462" y="198" text-anchor="middle" font-size="22" font-weight="800" fill="#65409a">Polaridad</text><text x="462" y="232" text-anchor="middle" font-size="18" fill="#52706d">μ = 0 o μ ≠ 0</text><rect x="640" y="150" width="215" height="120" rx="24" fill="#eaf8f6" stroke="#0f9f9a" stroke-width="4"/><text x="747" y="198" text-anchor="middle" font-size="22" font-weight="800" fill="#0c706c">Interacción</text><text x="747" y="232" text-anchor="middle" font-size="18" fill="#52706d">London / dipolo / H</text><rect x="925" y="150" width="215" height="120" rx="24" fill="#fff3e8" stroke="#d65f45" stroke-width="4"/><text x="1032" y="198" text-anchor="middle" font-size="22" font-weight="800" fill="#a33e2b">Propiedad</text><text x="1032" y="232" text-anchor="middle" font-size="18" fill="#52706d">Teb / Pvap / solubilidad</text><g stroke="#143a37" stroke-width="5" fill="none"><path d="M285 210h55"/><path d="M570 210h55"/><path d="M855 210h55"/></g><g fill="#143a37"><path d="M340 210l-14-9v18z"/><path d="M625 210l-14-9v18z"/><path d="M910 210l-14-9v18z"/></g><rect x="105" y="340" width="990" height="220" rx="28" fill="#f8fbfb" stroke="#d7e8e5" stroke-width="3"/><text x="145" y="390" font-size="20" font-weight="800" fill="#143a37">Reglas rápidas</text><text x="145" y="430" font-size="18" fill="#52706d">• London: siempre está presente.</text><text x="145" y="466" font-size="18" fill="#52706d">• Dipolo–dipolo: moléculas polares.</text><text x="145" y="502" font-size="18" fill="#52706d">• Puente de H: H unido directamente a N, O o F.</text><text x="630" y="430" font-size="18" fill="#52706d">• Ion–dipolo: ion + molécula polar.</text><text x="630" y="466" font-size="18" fill="#52706d">• Si el tipo de fuerza es el mismo, comparar tamaño, polarizabilidad y forma.</text><text x="630" y="502" font-size="18" fill="#52706d">• Más atracción → más energía para separar partículas.</text></g></svg>